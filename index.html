<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Function to get browser language
        function getBrowserLanguage() {
            // Get browser language (returns something like "en-US" or "zh-CN")
            const browserLang = (navigator.language || navigator.userLanguage).toLowerCase();
            
            // Check if it starts with Chinese language code
            if (browserLang.startsWith('zh')) {
                return 'zh';
            }
            return 'en';
        }

        // Function to get language preference from localStorage if it exists
        function getSavedLanguage() {
            return localStorage.getItem('preferredLanguage');
        }

        // Redirect to appropriate page
        window.onload = function() {
            // Check for saved language preference first
            const savedLang = getSavedLanguage();
            if (savedLang) {
                window.location.href = savedLang === 'zh' ? 'zh.html' : 'en.html';
                return;
            }

            // If no saved preference, use browser language
            const lang = getBrowserLanguage();
            // Default to Chinese version
            window.location.href = lang === 'en' ? 'en.html' : 'zh.html';
        }
    </script>
</head>
<body>
    <noscript>
        <meta http-equiv="refresh" content="0; url=zh.html">
    </noscript>
</body>
</html>
